# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: "Sierra Nelson | Mechanical Engineering Portfolio"


# Hero Section
name: Sierra Nelson
headline: Mechanical Engineering Student | Design, Research & Additive Manufacturing

description: >-
  I’m a mechanical engineering student at Florida A&M University who enjoys
  figuring out why a design works, where it fails, and how to make it better.
  My experience spans mechanical design, engineering research, CAD, prototype
  development, testing, and additive manufacturing. At Penn State’s Applied
  Research Laboratory, I worked on autonomous-system prototyping and
  computational design optimization. I also founded Print Pro 3D Designs,
  where I have translated customer ideas into more than 300 manufactured
  products. I’m most interested in work that lets me combine analysis,
  creativity, and hands on problem solving to build things that actually work.


